name: CI

on:
  pull_request:
  push:
    branches: [main, claude/beans-v1]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, unit tests and build
        run: pnpm check
      - name: Install the Playwright browser
        run: pnpm --filter @beans/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm --filter @beans/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
